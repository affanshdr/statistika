<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <!--
    SESI 1 SOAL 2: Rumah (segitiga + persegi panjang)
    Target: Bentuk G (House with shoulders)
    G = segi-7 (outline terluar dari segitiga atas dan badan persegi bawah, tanpa alas dalam/atap bawah)
  -->

  <!-- ── Atap Segitiga atas (terbagi di titik pertemuan dengan atap persegi: x=140 dan x=260) ── -->
  <!-- Sisi miring kiri atas (bagian dari G) -->
  <line id="q1-s2-line-1" x1="200" y1="140" x2="140" y2="215" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi miring kiri bawah (lanjutan di dalam persegi) -->
  <line id="q1-s2-line-2" x1="140" y1="215" x2="75" y2="296" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Sisi miring kanan atas (bagian dari G) -->
  <line id="q1-s2-line-3" x1="200" y1="140" x2="260" y2="215" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi miring kanan bawah (lanjutan di dalam persegi) -->
  <line id="q1-s2-line-4" x1="260" y1="215" x2="325" y2="296" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- ── Badan persegi panjang (terbagi di titik pertemuan dengan atap segitiga: x=140 dan x=260) ── -->
  <!-- Garis atas persegi - bagian kiri (shoulder kiri, bagian dari G) -->
  <line id="q1-s2-line-5" x1="75" y1="215" x2="140" y2="215" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Garis atas persegi - bagian tengah (di dalam atap segitiga) -->
  <line id="q1-s2-line-6" x1="140" y1="215" x2="260" y2="215" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Garis atas persegi - bagian kanan (shoulder kanan, bagian dari G) -->
  <line id="q1-s2-line-7" x1="260" y1="215" x2="325" y2="215" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- Sisi kiri persegi (bagian dari G) -->
  <line id="q1-s2-line-8" x1="75" y1="215" x2="75" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kanan persegi (bagian dari G) -->
  <line id="q1-s2-line-9" x1="325" y1="215" x2="325" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi bawah persegi (bagian dari G) -->
  <line id="q1-s2-line-10" x1="75" y1="340" x2="325" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
</svg>