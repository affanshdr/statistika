<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!--
    Shape A: Hexagon regular.
    Koordinat identik dengan jawaban A di sesi2-soal2.svg:
      (200,120) -> (335,160) -> (335,240) -> (200,280) -> (65,240) -> (65,160)
    Warna putih agar terlihat di background gelap.
  -->
  <line x1="200" y1="120" x2="335" y2="160" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
  <line x1="335" y1="160" x2="335" y2="240" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
  <line x1="335" y1="240" x2="200" y2="280" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
  <line x1="200" y1="280" x2="65"  y2="240" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
  <line x1="65"  y1="240" x2="65"  y2="160" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
  <line x1="65"  y1="160" x2="200" y2="120" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
