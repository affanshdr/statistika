<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!--
    Shape D: Rumah asimetris dengan shelf kanan (simetris tengah).
    Puncak di (140, 100), kaki di (80, 200) dan (200, 200)
    Shelf kanan: (200, 200) ke (320, 200)
    Dinding kiri: (80, 200) ke (80, 300)
    Dinding kanan: (320, 200) ke (320, 300)
    Dasar bawah: (80, 300) ke (320, 300)
  -->
  <!-- Left shoulder/wall -->
  <line x1="80"  y1="200" x2="80"  y2="300" stroke="#1C1917" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Left roof slope -->
  <line x1="80"  y1="200" x2="140" y2="100" stroke="#1C1917" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Right roof slope -->
  <line x1="140" y1="100" x2="200" y2="200" stroke="#1C1917" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Shelf kanan -->
  <line x1="200" y1="200" x2="320" y2="200" stroke="#1C1917" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Right vertical edge -->
  <line x1="320" y1="200" x2="320" y2="300" stroke="#1C1917" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Bottom edge -->
  <line x1="320" y1="300" x2="80"  y2="300" stroke="#1C1917" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
