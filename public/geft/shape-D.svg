<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!--
    Shape D: Rumah asimetris (peak offset ke kiri).
    Koordinat identik dengan jawaban D di sesi1-soal3.svg:
      kiri=80, kanan=320, tengah-y=200, bawah=300
      puncak di (178,100) — lebih ke kiri dari tengah (200)
    Warna putih agar terlihat di background gelap.
  -->
  <!-- Sisi kiri (dinding bawah kiri) -->
  <line x1="80"  y1="300" x2="80"  y2="200" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Atap kiri (lebih curam) -->
  <line x1="80"  y1="200" x2="178" y2="100" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Atap kanan (lebih landai) -->
  <line x1="178" y1="100" x2="320" y2="200" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Sisi kanan (dinding bawah kanan) -->
  <line x1="320" y1="200" x2="320" y2="300" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Dasar bawah -->
  <line x1="320" y1="300" x2="80"  y2="300" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
