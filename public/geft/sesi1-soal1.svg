<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <!-- ==========================================
       SESI 1 SOAL 1: Belah ketupat besar dengan salib/T di dalamnya
       Target: Bentuk B (T-shape)
       Garis jawaban: kepala T (atas horizontal), batang T (vertikal), bahu kiri, bahu kanan, dasar batang
       ========================================== -->

  <!-- Outline belah ketupat besar (diamond) -->
  <line id="q1-s1-line-1" x1="200" y1="50"  x2="360" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q1-s1-line-2" x1="360" y1="200" x2="200" y2="350" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q1-s1-line-3" x1="200" y1="350" x2="40"  y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q1-s1-line-4" x1="40"  y1="200" x2="200" y2="50"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Garis horizontal di tengah belah ketupat (membagi atas-bawah) -->
  <line id="q1-s1-line-5" x1="40"  y1="200" x2="360" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Garis vertikal di tengah (membagi kiri-kanan) -->
  <line id="q1-s1-line-6" x1="200" y1="50"  x2="200" y2="350" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Kepala T: garis horizontal atas di dalam (dari kiri ke kanan area atas) — ini bagian atas T -->
  <line id="q1-s1-line-7" x1="120" y1="155" x2="280" y2="155" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- Sisi kiri kepala T (vertikal kecil kiri) -->
  <line id="q1-s1-line-8" x1="120" y1="155" x2="120" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- Sisi kanan kepala T (vertikal kecil kanan) -->
  <line id="q1-s1-line-9" x1="280" y1="155" x2="280" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- Bahu kiri ke batang (horizontal kiri dari sisi kiri diamond ke batang T) -->
  <line id="q1-s1-line-10" x1="120" y1="200" x2="165" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- Bahu kanan ke batang (horizontal kanan dari batang T ke sisi kanan diamond) -->
  <line id="q1-s1-line-11" x1="235" y1="200" x2="280" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- Batang T kiri vertikal turun -->
  <line id="q1-s1-line-12" x1="165" y1="200" x2="165" y2="290" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- Batang T kanan vertikal turun -->
  <line id="q1-s1-line-13" x1="235" y1="200" x2="235" y2="290" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- Dasar batang T (bawah) -->
  <line id="q1-s1-line-14" x1="165" y1="290" x2="235" y2="290" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
</svg>