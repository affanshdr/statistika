<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <!-- ==========================================
       SESI 3 SOAL 2: Kotak besar dengan garis diagonal berlapis (hatching)
       Target: Bentuk G (persegi dengan takik miring kiri atas)
       ========================================== -->

  <!-- Persegi besar luar -->
  <line id="q3-s2-line-1" x1="60"  y1="80"  x2="340" y2="80"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s2-line-2" x1="340" y1="80"  x2="340" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s2-line-3" x1="340" y1="320" x2="60"  y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s2-line-4" x1="60"  y1="320" x2="60"  y2="80"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Diagonal kanan atas ke kiri bawah (dalam kotak) -->
  <line id="q3-s2-line-5"  x1="340" y1="80"  x2="60"  y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Garis diagonal paralel ke kanan (hatching bawah-kanan) -->
  <line id="q3-s2-line-6"  x1="200" y1="80"  x2="340" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s2-line-7"  x1="60"  y1="200" x2="200" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s2-line-8"  x1="60"  y1="80"  x2="340" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s2-line-9"  x1="60"  y1="130" x2="290" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s2-line-10" x1="110" y1="80"  x2="340" y2="250" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Garis horizontal tengah -->
  <line id="q3-s2-line-11" x1="60"  y1="200" x2="340" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Bentuk G tersembunyi di pojok kanan bawah:
       G = persegi panjang dengan takik miring di kiri atas
       Area: (200,200)-(340,200)-(340,320)-(200,320)
       dengan takik di sudut kiri atas dari (200,200) miring ke (250,200)
  -->
  <!-- Sisi bawah G -->
  <line id="q3-s2-line-12" x1="200" y1="320" x2="340" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kanan G -->
  <line id="q3-s2-line-13" x1="340" y1="320" x2="340" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi atas G -->
  <line id="q3-s2-line-14" x1="340" y1="200" x2="250" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Takik miring G -->
  <line id="q3-s2-line-15" x1="250" y1="200" x2="200" y2="250" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kiri bawah G -->
  <line id="q3-s2-line-16" x1="200" y1="250" x2="200" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
</svg>