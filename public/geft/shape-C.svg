<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shape C: L-shape / sudut siku terbalik (seperti sudut kanan bawah) -->
  <!-- Garis atas horizontal -->
  <line id="shape-C-line-1" x1="65" y1="70" x2="65" y2="140" stroke="#333" stroke-width="3" fill="none" pointer-events="all" style="cursor: pointer;" />
  <!-- Garis vertikal kiri turun -->
  <line id="shape-C-line-2" x1="65" y1="140" x2="135" y2="140" stroke="#333" stroke-width="3" fill="none" pointer-events="all" style="cursor: pointer;" />
  <!-- Garis bawah horizontal -->
  <line id="shape-C-line-3" x1="135" y1="140" x2="135" y2="105" stroke="#333" stroke-width="3" fill="none" pointer-events="all" style="cursor: pointer;" />
  <!-- Garis vertikal kanan naik ke tengah -->
  <line id="shape-C-line-4" x1="135" y1="105" x2="100" y2="70" stroke="#333" stroke-width="3" fill="none" pointer-events="all" style="cursor: pointer;" />
  <!-- Garis diagonal ke atas kiri -->
  <line id="shape-C-line-5" x1="100" y1="70" x2="65" y2="70" stroke="#333" stroke-width="3" fill="none" pointer-events="all" style="cursor: pointer;" />
</svg>