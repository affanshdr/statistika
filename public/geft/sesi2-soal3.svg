<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <!-- ==========================================
       SESI 2 SOAL 3: Kotak besar dengan banyak garis radial dari sudut
       Target: Bentuk G (persegi dengan takik miring kiri atas)
       ========================================== -->

  <!-- Persegi besar luar -->
  <line id="q2-s3-line-1" x1="60"  y1="60"  x2="340" y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s3-line-2" x1="340" y1="60"  x2="340" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s3-line-3" x1="340" y1="340" x2="60"  y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s3-line-4" x1="60"  y1="340" x2="60"  y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Garis horizontal dan vertikal tengah -->
  <line id="q2-s3-line-5" x1="60"  y1="200" x2="340" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s3-line-6" x1="200" y1="60"  x2="200" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Garis radial dari sudut kiri atas (ke titik tengah) -->
  <line id="q2-s3-line-7"  x1="60"  y1="60"  x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Garis radial dari sudut kanan atas -->
  <line id="q2-s3-line-8"  x1="340" y1="60"  x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Garis radial dari sudut kiri bawah -->
  <line id="q2-s3-line-9"  x1="60"  y1="340" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Garis radial dari sudut kanan bawah -->
  <line id="q2-s3-line-10" x1="340" y1="340" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Garis diagonal dari tengah sisi atas ke tengah sisi kanan -->
  <line id="q2-s3-line-11" x1="200" y1="60"  x2="340" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Garis diagonal dari tengah sisi kanan ke tengah sisi bawah -->
  <line id="q2-s3-line-12" x1="340" y1="200" x2="200" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Garis diagonal dari tengah sisi bawah ke tengah sisi kiri -->
  <line id="q2-s3-line-13" x1="200" y1="340" x2="60"  y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Garis diagonal dari tengah sisi kiri ke tengah sisi atas -->
  <line id="q2-s3-line-14" x1="60"  y1="200" x2="200" y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Bentuk G tersembunyi di kuadran kanan atas:
       G di antara (200,60)-(340,60)-(340,200)-(200,200)
  -->
  <!-- Sisi bawah G -->
  <line id="q2-s3-line-15" x1="200" y1="200" x2="340" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kanan G -->
  <line id="q2-s3-line-16" x1="340" y1="200" x2="340" y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi atas G -->
  <line id="q2-s3-line-17" x1="340" y1="60"  x2="250" y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Takik miring G -->
  <line id="q2-s3-line-18" x1="250" y1="60"  x2="200" y2="115" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kiri bawah G -->
  <line id="q2-s3-line-19" x1="200" y1="115" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
</svg>