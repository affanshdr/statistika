<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <defs>
    <!-- Pattern dot stipple berwarna orange/tan -->
    <pattern id="stipple" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#c4a482" opacity="0.85" />
    </pattern>
  </defs>

  <!-- Bidang arsir stippling coklat/orange -->
  <!-- 1. Segitiga atas -->
  <polygon points="200,50 140,100 260,100" fill="#c4a482" fill-opacity="0.15" />
  <polygon points="200,50 140,100 260,100" fill="url(#stipple)" />

  <!-- 2. Kotak bawah-kiri -->
  <polygon points="80,200 160,200 160,300 80,300" fill="#c4a482" fill-opacity="0.15" />
  <polygon points="80,200 160,200 160,300 80,300" fill="url(#stipple)" />

  <!-- 3. Kotak bawah-kanan -->
  <polygon points="240,200 320,200 320,300 240,300" fill="#c4a482" fill-opacity="0.15" />
  <polygon points="240,200 320,200 320,300 240,300" fill="url(#stipple)" />

  <!-- ── LINE SEGMENTS ── -->

  <!-- KELOMPOK 1: 6 Garis Jawaban Benar (Bentuk D) -->
  <!-- Dinding kiri -->
  <line id="q2-s3-line-1" x1="80" y1="200" x2="80" y2="300" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Atap kiri -->
  <line id="q2-s3-line-2" x1="80" y1="200" x2="140" y2="100" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Atap kanan -->
  <line id="q2-s3-line-3" x1="140" y1="100" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Shelf kanan (bagian dari sisi atas kotak tengah & kanan) -->
  <line id="q2-s3-line-4" x1="200" y1="200" x2="320" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Dinding kanan -->
  <line id="q2-s3-line-5" x1="320" y1="200" x2="320" y2="300" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Dasar bawah penuh -->
  <line id="q2-s3-line-6" x1="80" y1="300" x2="320" y2="300" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- KELOMPOK 2: Garis Lainnya (Distractors) -->
  <!-- Atap kanan segitiga kedua (kanan) -->
  <line id="q2-s3-line-7" x1="260" y1="100" x2="320" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Atap kiri segitiga kedua (kanan) -->
  <line id="q2-s3-line-8" x1="200" y1="200" x2="260" y2="100" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Sisi kiri segitiga atas -->
  <line id="q2-s3-line-9" x1="140" y1="100" x2="200" y2="50" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Sisi kanan segitiga atas -->
  <line id="q2-s3-line-10" x1="200" y1="50" x2="260" y2="100" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Alas segitiga atas -->
  <line id="q2-s3-line-11" x1="140" y1="100" x2="260" y2="100" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  
  <!-- Pemisah vertikal Kotak 1 & 2 -->
  <line id="q2-s3-line-12" x1="160" y1="200" x2="160" y2="300" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Pemisah vertikal Kotak 2 & 3 -->
  <line id="q2-s3-line-13" x1="240" y1="200" x2="240" y2="300" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Sisi atas Kotak 1 -->
  <line id="q2-s3-line-14" x1="80" y1="200" x2="160" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Sisi atas Kotak 2 bagian kiri -->
  <line id="q2-s3-line-15" x1="160" y1="200" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
</svg>