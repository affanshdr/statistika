<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <!-- ==========================================
       SESI 3 SOAL 3: Kotak 3D / balok perspektif
       Target: Bentuk C (L-shape / sudut siku — vertikal + horizontal saja)
       Jawaban C berada di area dalam kotak persegi (sudut kiri atas inner square
       + sisi atas muka depan + sisi kiri muka depan)
       ========================================== -->

  <!-- ── Muka depan balok (persegi panjang depan) ── -->
  <!-- Sisi atas muka depan -->
  <line id="q3-s3-line-1" x1="60"  y1="160" x2="260" y2="160" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kanan muka depan -->
  <line id="q3-s3-line-2" x1="260" y1="160" x2="260" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Sisi bawah muka depan -->
  <line id="q3-s3-line-3" x1="260" y1="340" x2="60"  y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Sisi kiri muka depan -->
  <line id="q3-s3-line-4" x1="60"  y1="340" x2="60"  y2="160" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- ── Sisi atas balok (parallelogram) ── -->
  <!-- Diagonal kiri atas -->
  <line id="q3-s3-line-5" x1="60"  y1="160" x2="160" y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Sisi atas horizontal -->
  <line id="q3-s3-line-6" x1="160" y1="60"  x2="360" y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Diagonal kanan atas -->
  <line id="q3-s3-line-7" x1="360" y1="60"  x2="260" y2="160" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- ── Sisi samping kanan balok ── -->
  <!-- Sisi kanan vertikal -->
  <line id="q3-s3-line-8" x1="360" y1="60"  x2="360" y2="240" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Diagonal bawah kanan -->
  <line id="q3-s3-line-9" x1="360" y1="240" x2="260" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- ── Kotak persegi dalam (jendela/lubang di muka depan) ── -->
  <!-- Sisi atas inner square -->
  <line id="q3-s3-line-10" x1="60"  y1="240" x2="170" y2="240" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kanan inner square -->
  <line id="q3-s3-line-11" x1="170" y1="240" x2="170" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi bawah inner square (shared dengan bottom front face) -->
  <line id="q3-s3-line-12" x1="170" y1="340" x2="60"  y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <!-- Sisi kiri inner square (shared dengan left front face — line-4) -->

  <!-- ── Garis horizontal tengah muka depan ── -->
  <line id="q3-s3-line-13" x1="60"  y1="240" x2="260" y2="240" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- ── Garis vertikal tengah muka depan ── -->
  <line id="q3-s3-line-14" x1="170" y1="160" x2="170" y2="240" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

</svg>