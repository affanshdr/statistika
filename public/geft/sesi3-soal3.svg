<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <!-- ==========================================
       SESI 3 SOAL 3: Kotak 3D / balok perspektif
       Target: Bentuk C (L-shape / sudut siku)
       ========================================== -->

  <!-- Muka depan balok (persegi panjang depan) -->
  <line id="q3-s3-line-1" x1="60"  y1="160" x2="240" y2="160" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s3-line-2" x1="240" y1="160" x2="240" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s3-line-3" x1="240" y1="320" x2="60"  y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s3-line-4" x1="60"  y1="320" x2="60"  y2="160" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Sisi atas balok (parallelogram atas) -->
  <line id="q3-s3-line-5" x1="60"  y1="160" x2="160" y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s3-line-6" x1="160" y1="60"  x2="340" y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s3-line-7" x1="340" y1="60"  x2="240" y2="160" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Sisi samping kanan balok -->
  <line id="q3-s3-line-8" x1="340" y1="60"  x2="340" y2="220" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s3-line-9" x1="340" y1="220" x2="240" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Kotak persegi dalam (jendela/lubang) -->
  <line id="q3-s3-line-10" x1="100" y1="200" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s3-line-11" x1="200" y1="200" x2="200" y2="285" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s3-line-12" x1="200" y1="285" x2="100" y2="285" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q3-s3-line-13" x1="100" y1="285" x2="100" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Bentuk C tersembunyi (L-shape / sudut siku):
       C = vertikal turun dari atas, lalu belok horizontal ke kanan, lalu naik ke pojok
       Posisi di sisi kanan atas balok:
       Dari sudut kiri atas persegi kecil, naik, miring ke kanan atas lalu ke kanan
  -->
  <!-- Sisi kiri C (vertikal) -->
  <line id="q3-s3-line-14" x1="200" y1="160" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi atas C (diagonal/miring ke kanan atas) -->
  <line id="q3-s3-line-15" x1="200" y1="160" x2="295" y2="110" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kanan atas C (horizontal ke kanan) -->
  <line id="q3-s3-line-16" x1="295" y1="110" x2="340" y2="110" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kanan bawah C (vertikal turun) -->
  <line id="q3-s3-line-17" x1="340" y1="110" x2="340" y2="145" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi dalam C (horizontal ke kiri) -->
  <line id="q3-s3-line-18" x1="340" y1="145" x2="240" y2="195" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Tutup C (vertikal ke bawah ke persegi dalam) -->
  <line id="q3-s3-line-19" x1="240" y1="195" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
</svg>