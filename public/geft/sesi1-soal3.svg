<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <!--
    SESI 1 SOAL 3: Persegi panjang dengan X-diagonal bawah dan shelf kanan
    Target: Bentuk D (rumah asimetris dengan shelf kanan)
    D = segi-6 (kiri bawah -> atap kiri -> atap kanan -> shelf kanan -> kanan bawah -> dasar bawah)
  -->

  <!-- ── Sisi atas persegi panjang (terbagi di puncak x=140) ── -->
  <line id="q1-s3-line-1" x1="80"  y1="100" x2="140" y2="100" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q1-s3-line-2" x1="140" y1="100" x2="320" y2="100" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- ── Sisi kiri persegi panjang (terbagi di y=200) ── -->
  <line id="q1-s3-line-3" x1="80"  y1="100" x2="80"  y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q1-s3-line-4" x1="80"  y1="200" x2="80"  y2="300" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- ── Sisi kanan persegi panjang (terbagi di y=200) ── -->
  <line id="q1-s3-line-5" x1="320" y1="100" x2="320" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q1-s3-line-6" x1="320" y1="200" x2="320" y2="300" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- ── Sisi bawah persegi panjang (penuh, bagian dari D) ── -->
  <line id="q1-s3-line-7" x1="80"  y1="300" x2="320" y2="300" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- ── Bagian Atap (bagian dari D) ── -->
  <!-- Atap kiri -->
  <line id="q1-s3-line-8" x1="80"  y1="200" x2="140" y2="100" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Atap kanan -->
  <line id="q1-s3-line-9" x1="140" y1="100" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- ── Garis X-diagonal (bukan bagian dari D) ── -->
  <line id="q1-s3-line-10" x1="80"  y1="300" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q1-s3-line-11" x1="80"  y1="200" x2="200" y2="300" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- ── Shelf kanan (bagian dari D) ── -->
  <line id="q1-s3-line-12" x1="200" y1="200" x2="320" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
</svg>
