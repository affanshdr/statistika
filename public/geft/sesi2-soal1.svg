<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <!-- ==========================================
       SESI 2 SOAL 1: Bintang 8 titik (star/octagram) 
       Target: Bentuk G (persegi dengan takik miring kiri atas)
       ========================================== -->

  <!-- Bintang 8 titik dari 2 persegi yang dirotasi 45° -->
  <!-- Persegi 1 (lurus) -->
  <line id="q2-s1-line-1" x1="130" y1="130" x2="270" y2="130" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s1-line-2" x1="270" y1="130" x2="270" y2="270" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s1-line-3" x1="270" y1="270" x2="130" y2="270" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s1-line-4" x1="130" y1="270" x2="130" y2="130" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Persegi 2 (dirotasi 45° = belah ketupat) -->
  <line id="q2-s1-line-5" x1="200" y1="60"  x2="340" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s1-line-6" x1="340" y1="200" x2="200" y2="340" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s1-line-7" x1="200" y1="340" x2="60"  y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s1-line-8" x1="60"  y1="200" x2="200" y2="60"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Diagonal persegi 1 (untuk memperumit) -->
  <line id="q2-s1-line-9"  x1="130" y1="130" x2="270" y2="270" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s1-line-10" x1="270" y1="130" x2="130" y2="270" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Bentuk G tersembunyi di kuadran kanan atas persegi lurus:
       G = sisi kiri vertikal, takik miring, atas, kanan, bawah
       Posisi: pojok kanan atas (antara (200,130)-(270,130)-(270,200)-(200,200))
  -->
  <!-- Sisi bawah G -->
  <line id="q2-s1-line-11" x1="200" y1="200" x2="270" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kanan G -->
  <line id="q2-s1-line-12" x1="270" y1="200" x2="270" y2="130" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi atas G -->
  <line id="q2-s1-line-13" x1="270" y1="130" x2="230" y2="130" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Takik miring G -->
  <line id="q2-s1-line-14" x1="230" y1="130" x2="200" y2="165" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <!-- Sisi kiri bawah G -->
  <line id="q2-s1-line-15" x1="200" y1="165" x2="200" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
</svg>