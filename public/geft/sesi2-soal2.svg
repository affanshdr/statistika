<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <defs>
    <!-- Pattern dot stipple berwarna orange/tan -->
    <pattern id="stipple" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#c4a482" opacity="0.85" />
    </pattern>

    <!-- Mask untuk melubangi Z-shape di area arsiran -->
    <mask id="z-mask">
      <!-- Semua area putih di mask akan disinari (terlihat) -->
      <rect width="400" height="400" fill="#ffffff" />
      <!-- Area hitam di mask akan dilubangi (transparan) -->
      <!-- Z-shape tebal: stroke-width 20px dengan linecap dan linejoin round agar mulus -->
      <path d="M 65,180 L 290,180 L 110,220 L 335,220" stroke="#000000" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </mask>
  </defs>

  <!-- ── Bidang arsir di belah ketupat kiri (L) yang dilubangi Z-shape ── -->
  <polygon points="155,80 20,200 155,320 290,200" fill="#c4a482" fill-opacity="0.12" mask="url(#z-mask)" />
  <polygon points="155,80 20,200 155,320 290,200" fill="url(#stipple)" mask="url(#z-mask)" />

  <!--
    SESI 2 SOAL 2: Dua belah ketupat tumpang tindih dengan Z-shape
    Target: Bentuk A (Hexagon regular)
    A = segi-6 (200,120 -> 335,160 -> 335,240 -> 200,280 -> 65,240 -> 65,160)
  -->

  <!-- ── Belah ketupat Kiri (L) ── -->
  <line id="q2-s2-line-1" x1="155" y1="80"  x2="20"  y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-2" x1="20"  y1="200" x2="155" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-3" x1="155" y1="320" x2="290" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-4" x1="290" y1="200" x2="155" y2="80"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- ── Belah ketupat Kanan (R) ── -->
  <line id="q2-s2-line-5" x1="245" y1="80"  x2="110" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-6" x1="110" y1="200" x2="245" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-7" x1="245" y1="320" x2="380" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-8" x1="380" y1="200" x2="245" y2="80"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- ── Hexagon Jawaban A (irisan L dan R) ── -->
  <line id="q2-s2-line-9"  x1="200" y1="120" x2="335" y2="160" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-10" x1="335" y1="160" x2="335" y2="240" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-11" x1="335" y1="240" x2="200" y2="280" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-12" x1="200" y1="280" x2="65"  y2="240" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-13" x1="65"  y1="240" x2="65"  y2="160" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-14" x1="65"  y1="160" x2="200" y2="120" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />

  <!-- ── Zigzag Z-shape di tengah ── -->
  <line id="q2-s2-line-15" x1="65"  y1="180" x2="290" y2="180" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-16" x1="110" y1="220" x2="335" y2="220" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-17" x1="290" y1="180" x2="110" y2="220" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
</svg>