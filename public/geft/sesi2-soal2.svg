<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0a1428" />

  <!-- ==========================================
       SESI 2 SOAL 2: Tumpukan belah ketupat berlapis dengan zigzag Z di tengah
       Target: Bentuk A (hexagon / segi enam)
       ========================================== -->

  <!-- Belah ketupat kiri atas -->
  <line id="q2-s2-line-1" x1="110" y1="80"  x2="200" y2="130" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-2" x1="200" y1="130" x2="110" y2="180" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-3" x1="110" y1="180" x2="20"  y2="130" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-4" x1="20"  y1="130" x2="110" y2="80"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Belah ketupat kanan atas -->
  <line id="q2-s2-line-5" x1="290" y1="80"  x2="380" y2="130" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-6" x1="380" y1="130" x2="290" y2="180" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-7" x1="290" y1="180" x2="200" y2="130" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-8" x1="200" y1="130" x2="290" y2="80"  stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Belah ketupat kiri bawah -->
  <line id="q2-s2-line-9"  x1="110" y1="220" x2="200" y2="270" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-10" x1="200" y1="270" x2="110" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-11" x1="110" y1="320" x2="20"  y2="270" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-12" x1="20"  y1="270" x2="110" y2="220" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Belah ketupat kanan bawah -->
  <line id="q2-s2-line-13" x1="290" y1="220" x2="380" y2="270" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-14" x1="380" y1="270" x2="290" y2="320" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-15" x1="290" y1="320" x2="200" y2="270" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-16" x1="200" y1="270" x2="290" y2="220" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Zigzag Z di tengah (menghubungkan ke-4 diamond) -->
  <line id="q2-s2-line-17" x1="110" y1="180" x2="290" y2="180" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-18" x1="110" y1="220" x2="290" y2="220" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />
  <line id="q2-s2-line-19" x1="290" y1="180" x2="110" y2="220" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" />

  <!-- Bentuk A tersembunyi: hexagon di area tengah
       A = hexagon 6 sisi di antara belah ketupat kiri atas & kanan bawah
       Koordinat hexagon (terlangkahi dari diamond center area)
  -->
  <line id="q2-s2-line-20" x1="155" y1="155" x2="245" y2="155" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-21" x1="245" y1="155" x2="290" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-22" x1="290" y1="200" x2="245" y2="245" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-23" x1="245" y1="245" x2="155" y2="245" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-24" x1="155" y1="245" x2="110" y2="200" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
  <line id="q2-s2-line-25" x1="110" y1="200" x2="155" y2="155" stroke="#666" stroke-width="2.5" fill="none" pointer-events="all" style="cursor:pointer;transition:stroke 0.2s,stroke-width 0.2s;" data-correct="true" />
</svg>